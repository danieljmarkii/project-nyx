<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The extraction job's fontconfig (CUL-2292). run.sh points FONTCONFIG_FILE here, so every run,
     in CI or on a laptop, prints the report's sans in Inter: the face CUL-2385 and CUL-2386 were
     measured in. The system config is included first and these preferences are prepended after it,
     so Inter wins the generics the stylesheet falls back to. extract.py fails if it did not. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
