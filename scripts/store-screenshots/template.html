<!doctype html>

<head>
<meta charset="utf-8">
<title>Culprit — store screenshot frame (B-269 export pipeline)</title>
<style>
  /* ══════════════════════════════════════════════════════════════════════
     Store screenshot template — one frame per page load, true 1320×2868.

     DESIGN AUTHORITY: docs/culprit-store-screenshot-mockups.html (round 5).
     Every geometry value below is in that mock's frame units (a 300px-wide
     frame, aspect 1320/2868) and the whole stage is scaled ×4.4 to the real
     export size — so the mock's CSS ports 1:1 and a design change lands in
     both files as the same numbers. Do not "clean up" the fractional stage
     height: 300×4.4 = 1320 and 651.8182×4.4 = 2868 exactly.

     Two deliberate departures from the mock page:
       • no frame border-radius / page shadow — the upload is full-bleed;
       • the mock's annotation layers (.fnote/.fmeta "Real cards, composited
         from the Home capture") are review notes, not artwork — excluded.

     Typefaces are the REAL app faces (the mock page used system stand-ins):
     Geist for UI sans, Newsreader for the display serif, loaded from the
     same @expo-google-fonts packages lib/fonts.ts registers.

     Query contract (set by render.js — see that file):
       ?frame=1..6&mode=draft|capture
       capture mode extras: &img=captures/<shot>.png
         frame 1 only:      &crops=<encoded hero-crops.json>&capw=<capture px width>
     ══════════════════════════════════════════════════════════════════════ */

  @font-face{font-family:'Geist';font-weight:400;src:url('../../node_modules/@expo-google-fonts/geist/400Regular/Geist_400Regular.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:500;src:url('../../node_modules/@expo-google-fonts/geist/500Medium/Geist_500Medium.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:600;src:url('../../node_modules/@expo-google-fonts/geist/600SemiBold/Geist_600SemiBold.ttf') format('truetype')}
  @font-face{font-family:'Newsreader';font-weight:400;src:url('../../node_modules/@expo-google-fonts/newsreader/400Regular/Newsreader_400Regular.ttf') format('truetype')}
  @font-face{font-family:'Newsreader';font-weight:700;src:url('../../node_modules/@expo-google-fonts/newsreader/700Bold/Newsreader_700Bold.ttf') format('truetype')}

  *{box-sizing:border-box}
  /* body/stage/frame sizes are set by build() from the ?w=&h= params —
     default 1320×2868 (6.9″), or e.g. 1284×2778 for a native 6.5″-slot set.
     The stage always lays out 300 mock units wide (scale = w/300); a smaller
     slot's slightly taller aspect crops ~3 mock units off the bottom bleed,
     which the phone's deliberate overhang absorbs. */
  body{margin:0;overflow:hidden;background:#F2EEE4}
  #stage{width:300px;transform-origin:0 0}

  /* ── The frame (grounds + caption) — mock .fframe, radius/shadow dropped ── */
  .fframe{position:relative;width:300px;overflow:hidden}
  .d-day{background:#F2EEE4}
  .d-night{background:#13112E}
  .d-night::before{content:"";position:absolute;inset:-30% -20% auto;height:60%;background:radial-gradient(ellipse at 50% 0%,#221C56 0%,transparent 65%);pointer-events:none}
  .fcapt{position:relative;z-index:2;font-family:Newsreader,Georgia,serif;text-align:center;margin:0 auto;text-wrap:balance}
  .d-day .fcapt{color:#211E4E;font-size:17.5px;line-height:1.42;padding:28px 20px 0;max-width:21ch}
  .fcapt b{font-weight:700}

  /* ── The phone (day frames): 440×956 = the 6.9″ point grid, scaled .582 ── */
  .fphone{position:absolute;left:50%;transform:translateX(-50%);top:122px;z-index:1;width:256px;height:555px}
  .fphone .phone-scale{transform:scale(.582);transform-origin:top left}
  .phone{width:440px;height:956px;background:#FAFAFA;border-radius:36px;position:relative;overflow:hidden;
    box-shadow:0 0 0 9px #17171A,0 0 0 10.5px rgba(33,30,78,.16),0 28px 54px rgba(33,30,78,.24);
    font-family:Geist,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0A0A0A}
  .phone .shot-img{position:absolute;inset:0;width:440px;height:956px;object-fit:cover}

  /* ── The night hero (frame 1) — mock .heroBig ── */
  .heroBig .cmark{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;padding-top:30px;color:#A6A2CE}
  .heroBig .cmark svg{width:17px;height:17px;fill:#F2EEE4}
  .heroBig .cmark span{font-family:Newsreader,Georgia,serif;font-size:15px;letter-spacing:.4px}
  .heroBig .fcapt{color:#F2EEE4;font-size:25px;line-height:1.32;padding:20px 22px 0;max-width:17ch}
  .heroBig .float-cards{position:absolute;left:20px;right:20px;top:238px;z-index:1;display:flex;flex-direction:column;gap:14px}
  .heroBig .card{padding:16px 17px;border-radius:16px;border:none;box-shadow:0 20px 48px rgba(0,0,0,.55)}
  .heroBig .sig-head{font-size:16.5px;line-height:1.35}
  .heroBig .sig-body{font-size:13px;line-height:1.5}
  .heroBig .sig-sample{font-size:10.5px;margin-top:5px}
  .heroBig .rail-card{padding-left:11px}
  .heroBig .rlabel{font-size:10px}
  /* capture mode: each Signal card is a crop of the Home capture, rounded +
     shadowed like the drawn cards — composited, never redrawn */
  .crop-card{position:relative;overflow:hidden;border-radius:16px;box-shadow:0 20px 48px rgba(0,0,0,.55);background:#FFF}
  .crop-card img{position:absolute;display:block}

  /* ══ Phone interiors (draft stand-ins) — ported verbatim from the mock ══ */
  .sbar{height:56px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 34px 6px;position:relative}
  .sbar .time{font-size:16px;font-weight:600}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#0A0A0A;border-radius:20px}
  .sicons{display:flex;align-items:center;gap:7px}
  .cell{display:flex;align-items:flex-end;gap:2px}
  .cell i{width:3.5px;background:#0A0A0A;border-radius:1px;display:block}
  .wifi{width:17px;height:12px}
  .batt{width:26px;height:12px;border:1.5px solid rgba(10,10,10,.5);border-radius:4px;position:relative}
  .batt::after{content:"";position:absolute;inset:1.5px;background:#0A0A0A;border-radius:2px}
  .batt::before{content:"";position:absolute;right:-4px;top:3.5px;width:2px;height:5px;background:rgba(10,10,10,.5);border-radius:0 2px 2px 0}
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#0A0A0A;opacity:.85;z-index:8}

  .pad{padding:0 20px}
  .eyebrow{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#737373;font-weight:600}
  .zonehead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
  .zonehead .link{font-size:14px;color:#737373}
  .card{background:#FFFFFF;border-radius:18px;border:1px solid #F0F0EE;box-shadow:0 1px 2px rgba(10,10,10,.04);padding:18px}
  .hair{height:1px;background:#EAEAEA;margin:14px 0}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#FFFFFF;border-top:1px solid #EAEAEA;display:flex;justify-content:space-around;align-items:flex-start;padding:16px 30px 0}
  .tabbar span{font-size:14px;color:#737373}
  .tabbar span.on{color:#0A0A0A;font-weight:600}
  .fab{position:absolute;right:22px;bottom:104px;width:58px;height:58px;border-radius:50%;background:#00C2A8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:300;box-shadow:0 6px 16px rgba(0,194,168,.4);z-index:7}
  .evicon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .evicon svg{width:16px;height:16px}
  .ev-meal{background:#E0FBF7}.ev-meal svg{fill:#0B7B6C}
  .ev-sym{background:#FFE4E6}.ev-sym svg{fill:#9F1239}
  .ev-weight{background:#F5F5F5}.ev-weight svg{fill:#525252}
  .row{display:flex;align-items:center;gap:12px;padding:12px 0}
  .row .grow{flex:1;min-width:0}
  .row .lbl{font-size:15px;font-weight:500}
  .row .sub{font-size:13px;color:#737373;margin-top:1px}
  .row .when{font-size:13px;color:#737373;text-align:right;white-space:nowrap}
  .tag{display:inline-block;font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:#737373;border:1px solid #E4E4E1;border-radius:5px;padding:1px 5px;vertical-align:1px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:13px;border:1px solid #E4E4E1;border-radius:99px;padding:5px 13px;color:#525252;background:#FFF}
  .chip.on{background:#0A0A0A;color:#FFF;border-color:#0A0A0A}

  /* Home */
  .apphead{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 0}
  .wordmark{display:flex;align-items:center;gap:7px;color:#737373}
  .wordmark svg{width:17px;height:17px;fill:#211E4E}
  .wordmark .wm{font-family:Newsreader,Georgia,serif;font-size:17px;letter-spacing:.2px}
  .avatar{width:32px;height:32px;border-radius:50%;background:#EAEAEA;color:#525252;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .petrow{display:flex;align-items:center;gap:12px;padding:14px 20px 4px}
  .petava{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FDF3E3;overflow:hidden}
  .petava svg{width:86%;height:86%}
  .petname{font-size:22px;font-weight:600;line-height:1.2}
  .petid{font-size:13px;color:#737373}
  .rail-card{border-left:3px solid transparent;padding-left:13px}
  .rail-safety{border-left-color:#F43F5E}
  .rail-insight{border-left-color:#00C2A8}
  .sig-head{font-family:Newsreader,Georgia,serif;font-size:23px;line-height:1.3;letter-spacing:-.2px}
  .sig-body{font-size:15px;line-height:1.5}
  .sig-sample{font-size:12px;color:#737373;margin-top:6px}
  .sig-hint{font-size:13px;color:#737373;margin-top:8px}
  .sig-foot{font-size:14px;color:#0B7B6C;margin-top:14px}
  .prog{height:4px;border-radius:2px;background:#F0F0EE;margin-top:12px;overflow:hidden}
  .prog i{display:block;height:100%;width:45%;background:#00C2A8;border-radius:2px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:12px}
  .bars i{flex:1;background:#E4E4E1;border-radius:3px 3px 0 0}
  .bars i.hit{background:#F43F5E}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:#A3A3A3;margin-top:5px}

  /* the dot-lane receipt (B-721 shape A — round 5) */
  .receipt{margin-top:11px}
  .rlane{display:flex;align-items:center;gap:6px;background:#F7F7F5;border-radius:13px;padding:6px 10px}
  .rdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .r-quiet{border:1.5px solid #D4D4D4;background:transparent}
  .r-food{width:8px;height:8px;background:#00C2A8}
  .r-sym{width:8px;height:8px;background:#F43F5E}
  .rwin{display:flex;align-items:center;gap:4px;background:#FFE4E6;border-radius:10px;padding:3px 6px;flex:0 0 auto}
  .rlabel{display:flex;justify-content:space-between;font-size:9.5px;color:#737373;margin-top:5px}

  /* menus / sheets (frame 2) */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:5}
  .menu{position:absolute;right:22px;bottom:240px;width:312px;background:#FFF;border-radius:20px;box-shadow:0 18px 48px rgba(0,0,0,.28);padding:10px 18px;z-index:6}
  .menu .mh{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#737373;font-weight:600;padding:10px 0 2px}
  .menu .mi{display:flex;align-items:center;gap:11px;padding:11px 0}
  .menu .mi .lbl{font-size:15px;font-weight:500}
  .menu .mi .sub{font-size:12.5px;color:#737373}
  .menu .hair{margin:6px 0}

  /* nav header (stack screens) */
  .navhead{display:flex;align-items:center;justify-content:center;position:relative;padding:12px 20px 10px}
  .navhead .ttl{font-size:17px;font-weight:600}
  .navhead .back{position:absolute;left:16px;font-size:24px;color:#0A0A0A;line-height:1}

  /* patterns */
  .metric-top{display:flex;justify-content:space-between;align-items:baseline}
  .metric-lbl{font-size:14px;font-weight:600}
  .metric-cap{font-size:11px;color:#737373;letter-spacing:.4px;text-transform:uppercase}
  .metric-val{font-size:30px;font-weight:600;margin-top:6px}
  .metric-note{font-size:13px;color:#525252;margin-top:2px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:10px}
  .spark i{flex:1;background:#E4E4E1;border-radius:2px 2px 0 0}
  .spark i.hit{background:#F43F5E}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}
  .cal b{height:26px;border-radius:8px;background:#F5F5F5;display:flex;align-items:center;justify-content:center}
  .cal b.dot{background:#FFE4E6}
  .cal b.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:#F43F5E}

  /* report */
  .doc{background:#FFF;border:1px solid #EAEAEA;border-radius:12px;padding:18px 18px 8px;margin-top:14px;font-size:13px}
  .doc .dochead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .doc .pt{font-size:13px;letter-spacing:.6px;font-weight:700}
  .doc .dr{font-size:11.5px;color:#525252;text-align:right}
  .doc .flag{display:flex;gap:8px;align-items:flex-start;background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:8px 10px;margin:12px 0;font-size:12.5px}
  .doc .flag b{color:#9A3412;font-weight:700}
  .doc .sec{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#737373;font-weight:700;margin:12px 0 4px}
  .doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .doc td{padding:5px 0;border-top:1px solid #F0F0EE;font-size:12.5px;vertical-align:top}
  .doc td:last-child{text-align:right;color:#262626}
  .doc .fade{height:44px;background:linear-gradient(#FFF0,#FFF);margin:2px -18px 0;position:relative}
  .doc .ghost{color:#C9C9C6}
  .docchart{margin-top:12px}
  .docchart .bars{height:40px;gap:3px;margin-top:8px}
  .docchart .bars i{background:#EDEDEA;min-height:3px}
  .docchart .bars i.hit{background:#F43F5E}
  .docchart .axis{margin-top:4px}
  .btm{position:absolute;left:0;right:0;bottom:0;background:#FFF;border-top:1px solid #EAEAEA;padding:14px 20px 30px}
  .btm .inc{font-size:12px;color:#737373;margin-bottom:10px}
  .btn{background:#0A0A0A;color:#FFF;border-radius:14px;padding:15px 0;text-align:center;font-size:16px;font-weight:600}
  .btm .hint{font-size:12px;color:#737373;text-align:center;margin-top:9px}

  /* history */
  .bigttl{font-size:24px;font-weight:600}
  .headrow{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 6px}
  .pills{display:flex;gap:8px}
  .pill{font-size:13px;color:#525252;border:1px solid #E4E4E1;border-radius:99px;padding:5px 12px;background:#FFF}
</style>

<div id="stage"></div>
<script>
'use strict';

/* Frame manifest — order + captions are the round-5 mock verbatim (upload
   order per docs/store-screenshot-plan.md §3 / D-SS3). CAPTION STATUS: these
   are the round-5 lines; the final caption pass is joint with step 13's
   keyword set (plan §5) — when that lands, edit ONLY these strings. */
const FRAMES = {
  1: { ground:'night', caption:'Keep the record. See the patterns.' },
  2: { ground:'day', screen:'quicklog', caption:'<b>Two taps, logged.</b> Yesterday’s food is today’s button.' },

  home(){ return SBAR
    + '<div class="apphead"><span class="wordmark">' + CRESCENT + '<span class="wm">Culprit</span></span><span class="avatar">J</span></div>'

/* Frame 1 capture mode: composite the two Signal cards OUT of the Home
   capture (plan §0.5 D-SS1 — "never redrawn"). Crop rects come from
   captures/hero-crops.json in capture pixels; the card renders at the
   heroBig width (frame 300 − 2×20 inset = 260 mock units). */
function cropCard(src, rect, capW){
  const w = 260, s = w / rect.w;
  return '<div class="crop-card" style="width:' + w + 'px;height:' + (rect.h * s) + 'px">'
    + '<img src="' + src + '" style="width:' + (capW * s) + 'px;left:' + (-rect.x * s) + 'px;top:' + (-rect.y * s) + 'px"></div>';
}

function heroHTML(mode, q){
  let cards;
  if (mode === 'capture') {
    const crops = JSON.parse(q.get('crops'));
    const capW = +q.get('capw') || 1320;
    cards = cropCard(q.get('img'), crops.safety, capW) + cropCard(q.get('img'), crops.insight, capW);
  } else {
    cards = CARD_SAFETY + CARD_INSIGHT;
  }
  return '<div class="cmark">' + CRESCENT + '<span>Culprit</span></div>'
    + '<p class="fcapt">' + FRAMES[1].caption + '</p>'
    + '<div class="float-cards">' + cards + '</div>';
}

(function build(){
  const q = new URLSearchParams(location.search);
  const n = +(q.get('frame') || 1);
  const mode = q.get('mode') || 'draft';
  const f = FRAMES[n];
  if (!f) { document.body.textContent = 'Unknown frame: ' + n; return; }
  // Export geometry (defaults = the 6.9″ ASC spec)
  const W = +(q.get('w') || 1320), H = +(q.get('h') || 2868);
  const scale = W / 300, stageH = H / scale;
  document.body.style.width = W + 'px';
  document.body.style.height = H + 'px';
  const stage = document.getElementById('stage');
  stage.style.height = stageH + 'px';
  stage.style.transform = 'scale(' + scale + ')';
  const el = document.createElement('div');
  el.className = 'fframe ' + (f.ground === 'night' ? 'd-night' : 'd-day') + (n === 1 ? ' heroBig' : '');
  el.style.height = stageH + 'px';
  if (n === 1) {
    el.innerHTML = heroHTML(mode, q);
  } else {
    const inner = mode === 'capture'
      ? '<img class="shot-img" src="' + q.get('img') + '">'
      : SCREENS[f.screen]();
    el.innerHTML = '<p class="fcapt">' + f.caption + '</p>'
      + '<div class="fphone"><div class="phone-scale"><div class="phone">' + inner + '</div></div></div>';
  }
  document.getElementById('stage').appendChild(el);
})();
</script>
