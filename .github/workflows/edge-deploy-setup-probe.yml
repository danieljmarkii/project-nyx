# TEMPORARY (CUL-1147): proves the one-time setup for #901 from this branch before
# the merge, then is deleted in the next commit. Never merge this file.
#
# `settings` reads the environments through the API and checks the token is not a
# repository or organization secret (presence only; the value is never printed).
# `lock` targets `production` from a branch that is not main: the environment must
# refuse it before its first step, so that job failing is the pass.
name: Edge deploy setup probe

on:
  push:
    branches: [claude/great-volta-yxw6zj]

permissions: {}

jobs:
  settings:
    name: Setup readout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Read the environments and where the token lives
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TOKEN_OUTSIDE_ENV: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          api() {
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/$1" 2>/dev/null \
            || curl -fsS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"
          }
          bad=0
          envs=$(api environments)
          echo "Environments: $(jq -r '[.environments[].name] | join(", ")' <<<"$envs")"
          prod=$(jq -c '.environments[] | select(.name == "production")' <<<"$envs")
          if [ -z "$prod" ]; then echo "::error::There is no production environment."; exit 1; fi
          echo "production branch policy: $(jq -c '.deployment_branch_policy' <<<"$prod")"
          echo "production protection rules: $(jq -c '[.protection_rules[]?.type]' <<<"$prod")"
          if [ "$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<<"$prod")" != "true" ] \
            || [ "$(jq -r '.deployment_branch_policy.protected_branches // false' <<<"$prod")" != "false" ]; then
            echo "::error::production is not set to Selected branches and tags."; bad=1
          fi
          rules=$(api environments/production/deployment-branch-policies | jq -c '[.branch_policies[] | {name, type}]')
          echo "production branch rules: $rules"
          if [ "$rules" != '[{"name":"main","type":"branch"}]' ]; then
            echo "::error::production must have exactly one rule: branch main."; bad=1
          fi
          if jq -e '[.protection_rules[]?.type] | any(. == "required_reviewers" or . == "wait_timer")' <<<"$prod" >/dev/null; then
            echo "::warning::production has Required reviewers or a Wait timer, so every merge will wait for a click."
          fi
          if jq -e '.environments[] | select(.name == "edge-functions")' <<<"$envs" >/dev/null; then
            echo "edge-functions: exists"
          else
            echo "::warning::There is no edge-functions environment yet. The first deploy record creates it."
          fi
          if [ -n "$TOKEN_OUTSIDE_ENV" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN reaches a job with no environment, so it is a repository or organization secret. Delete it there."; bad=1
          else
            echo "SUPABASE_ACCESS_TOKEN outside production: not present (correct)"
          fi
          exit "$bad"

  lock:
    name: production refuses this branch (a failure here is the pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Only reached if production admits a branch that is not main
        run: |
          echo "::error::production admitted a branch that is not main. Add the main-only rule before merging."
          exit 1
