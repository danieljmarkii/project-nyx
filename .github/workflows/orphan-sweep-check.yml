# The daily orphaned-storage check (CUL-2521, PM ruling 2026-11-05: an outcome check).
#
# Reads the answer the daily check stored (pg_cron runs the check at 12:07 UTC, migration 123): whether any file
# the 09:23 UTC run should have removed is still stored, whether the check could not read everything, or whether
# no check stored an answer in the last 24 hours. Opens a Linear issue
# (team Culprit) when either holds or the function cannot answer; a later day comments on the open issue instead
# of opening another. Why it reads the outcome rather than the run's log line is scripts/ops/orphanSweepCheck.ts.
#
# NEVER A REQUIRED CHECK, NEVER ON A PULL REQUEST: its own workflow, on a schedule and by hand only, like
# report-drafts-check.yml. It runs no pass, so a run by hand works at any hour (CUL-2897: the check itself left
# GitHub because GitHub started it 5 to 10 hours late, past its window, every day).
#
# THE KEY. LINEAR_API_KEY is the ops-alerts environment secret (docs/secrets-register.md), readable from `main`
# only. Until it is set (CUL-2518) a finding exits non-zero, so GitHub's failed-run email is the alert.
name: Orphaned storage check

on:
  schedule:
    # Daily, 14:37 UTC: after the 12:07 check. A late start is harmless: the answer is read for 24 hours.
    - cron: '37 14 * * *'
  workflow_dispatch:

concurrency:
  group: orphan-sweep-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Orphaned files the sweep left
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: ops-alerts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # No npm ci: the script imports only node:fs and its sibling modules.
      - name: Ask the sweep, and tell Linear if it needs a person
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node --experimental-strip-types scripts/ops/orphanSweepCheck.cli.ts
