# Simulator smoke (CUL-2864, Workflow v2 PR-10; ruled as D6 on CUL-2854): build the app for
# an iPhone simulator on a free GitHub Mac runner, install it, launch it and photograph the
# first screen. Step one proved the unsigned simulator build works with the widget extension
# and the App Group, and that the Mac image is offered to this repo.
#
# Step two (CUL-2875, PR-11): one real flow. `.maestro/golden-meal.yaml` signs in as the
# fixture owner, logs a meal from the plus button and checks it on Home's Today card, with
# the screen recorded (`simctl io recordVideo`) and the video, the screenshots and the logs
# linked from the job summary. The summary also says whether the meal reached the fixture
# host (the sync push), which the flow itself cannot assert without racing it. One retry at most, and the summary says when it was used: a
# flaky step is fixed, never quarantined. A pass is a smoke reading, never a review: it
# clears nothing on a never-list surface.
#
# REPORTS, NEVER BLOCKS, on layout-captures.yml's terms: its own workflow so it can never
# join the `main` ruleset's required checks by accident (those are named in ci.yml), and its
# path filter scopes it to the PRs that can change what launches. It is not
# `continue-on-error`: a build that fails or an app that dies on launch shows red, because a
# green over a broken harness would read as "it launches". Red here holds no merge.
#
# The image. The app pins Xcode 27.1 (eas.json's `macos-tahoe-26.6-xcode-27.1`), which only
# GitHub's `xcode-27` image carries (a preview label; macos-26 tops out at Xcode 26.x). A
# manual run can name another runner and Xcode, for the day the preview label goes away.
#
# Native reuse. The built .app is cached on the native fingerprint (@expo/fingerprint) plus
# the Xcode version. A change with no native code restores it and only rebuilds the JS, which
# @expo/repack-app writes into a copy of the cached app; a native change pays the full
# xcodebuild. The job summary says which, and how long each took.
#
# Fixture only, never a real account: the bundle points Supabase at http://127.0.0.1:54321,
# where scripts/sim/fixtureServer.ts answers from the device-pass fixture story (the capture
# path's fixtureRest.ts). The simulator shares the runner's loopback, and the prebuild
# template allows local HTTP. Nothing else on the runner listens there. Read-only token: nothing here comments, pushes or writes outside the run.
name: Simulator smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      # Native config: anything the fingerprint reads that a PR can change.
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'widgets/**'
      - 'patches/**'
      - 'assets/**'
      # The flow reads Home, so what Home reads can break it too.
      - 'lib/**'
      - 'store/**'
      - 'hooks/**'
      - 'constants/**'
      - '.maestro/**'
      - 'scripts/sim/**'
      - 'scripts/fixture/**'
      - 'scripts/demo/**'
      - 'scripts/web-capture/fixtureRest.ts'
      - '.github/workflows/sim-smoke.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (xcode-27 is the preview image carrying Xcode 27.1)'
        default: 'xcode-27'
      xcode:
        description: 'Xcode version to select (falls back to the newest installed, with a warning)'
        default: '27.1'

concurrency:
  group: sim-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Simulator smoke (reported, not gating)
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 90
    env:
      WANT_XCODE: ${{ inputs.xcode || '27.1' }}
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      FIXTURE_PORT: '54321'
      # Released 2026-10-26. The release zip is fetched by tag and checked against this hash,
      # never through the unpinned install script.
      MAESTRO_VERSION: 2.12.0
      MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e
      EXPO_PUBLIC_SUPABASE_ANON_KEY: fixture-anon-key
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Work directories
        run: |
          {
            echo "SIM=$RUNNER_TEMP/sim"
            echo "APP_CACHE=$RUNNER_TEMP/sim/cached"
            echo "APP_OUT=$RUNNER_TEMP/sim/out"
            echo "SHOTS=$RUNNER_TEMP/sim/shots"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sim/cached" "$RUNNER_TEMP/sim/out" "$RUNNER_TEMP/sim/shots"
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The image and the Xcode, written to the summary either way: the row's second unknown.
      - name: Select Xcode
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          sw_vers || true
          ls -d /Applications/Xcode*.app || true
          want="/Applications/Xcode_${WANT_XCODE}.app"
          if [ -d "$want" ]; then
            pick="$want"
          else
            pick="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
            echo "::warning::Xcode ${WANT_XCODE} is not on this image; using $pick, the newest installed"
          fi
          sudo xcode-select -s "$pick/Contents/Developer"
          # Read whole, never piped to head: under pipefail xcodebuild dies on the closed pipe.
          xcodebuild -version > "$SIM/xcode-version.txt"
          cat "$SIM/xcode-version.txt"
          ver="$(awk 'NR==1{print $2}' "$SIM/xcode-version.txt")"
          echo "Selected $pick ($ver)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "XCODE_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Native fingerprint
        id: fp
        shell: bash
        run: |
          set -euo pipefail
          hash="$(npx @expo/fingerprint fingerprint:generate --platform ios | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).hash))')"
          echo "Fingerprint $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the built app
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ${{ runner.temp }}/sim/cached
          key: sim-app-signed-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ steps.fp.outputs.hash }}

      # One iPhone on the newest iOS runtime the selected Xcode carries. Picked before the
      # build so xcodebuild builds the simulator's own architecture only.
      - name: Pick a simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          udid="$(xcrun simctl list devices available -j | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const devs = JSON.parse(s).devices;
              const ios = Object.keys(devs).filter(k => /SimRuntime\.iOS-/.test(k))
                .sort((a,b) => {
                  const v = k => k.replace(/.*iOS-/, "").split("-").map(Number);
                  const [x,y] = [v(a), v(b)];
                  for (let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; }
                  return 0;
                });
              for (const rt of ios.reverse()) {
                // One screen only: a foldable (the iPhone Duo) has two displays, and
                // `simctl io screenshot` refuses to pick one.
                const phone = devs[rt].find(d => d.isAvailable && /^iPhone/.test(d.name) && !/Duo|Fold/i.test(d.name));
                if (phone) { console.error(`Simulator: ${phone.name} on ${rt}`); process.stdout.write(phone.udid); return; }
              }
              process.exit(1);
            })')"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          name="$(xcrun simctl list devices -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const l of Object.values(JSON.parse(s).devices))for(const d of l)if(d.udid===process.argv[1])process.stdout.write(d.name)})' "$udid")"
          echo "SIM_NAME=$name" >> "$GITHUB_ENV"
          # Boot now, in the background of the build.
          xcrun simctl boot "$udid" || true

      - name: Build for the simulator (cold)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          t0=$(date +%s)
          npx expo prebuild --platform ios --clean
          ws="$(ls -d ios/*.xcworkspace | head -1)"
          scheme="$(basename "$ws" .xcworkspace)"
          echo "Workspace $ws, scheme $scheme"
          # Updates off: a Release build with expo-updates on would fetch production's
          # published update at launch and photograph that instead of this commit's JS.
          find ios -name Expo.plist -not -path '*/Pods/*' -print -exec \
            /usr/libexec/PlistBuddy -c 'Set :EXUpdatesEnabled false' {} \;
          # Signed to run locally (identity "-", no team), as Xcode signs a simulator run: the
          # entitlements (the App Group) go into the binary as simulated entitlements. Unsigned,
          # the binary has none and every keychain call fails, so the session never persists
          # and the sync never pulls the record. Re-signing after the build cannot stand in:
          # macOS refuses an ad-hoc signature that claims keychain entitlements (run 45034999097).
          build() {
            status=0
            xcodebuild \
              -workspace "$ws" -scheme "$scheme" -configuration Release \
              -sdk iphonesimulator -destination "id=$SIM_UDID" \
              -derivedDataPath "$SIM/dd" \
              ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
              build > "$SIM/xcodebuild.log" 2>&1 || status=$?
          }
          build
          # expo-modules-autolinking gives its @ExpoModule scan a fixed 5000 ms (moduleScanner.js),
          # which a cold scan on a loaded preview runner can overrun; Xcode then stops with
          # "Build again to retry the scan". Only that failure gets one incremental rebuild,
          # named in the summary; any other failure, or the same one twice, stays red.
          if [ "$status" -ne 0 ] && grep -q "Scanning for @ExpoModule classes didn't complete" "$SIM/xcodebuild.log"; then
            echo "::warning::the Expo module scan timed out (its fixed 5s budget); rebuilding once"
            cp "$SIM/xcodebuild.log" "$SIM/xcodebuild-scan-timeout.log"
            echo "BUILD_NOTE=rebuilt once: the Expo module scan overran its 5s budget" >> "$GITHUB_ENV"
            build
          fi
          grep -E 'error:|\*\* BUILD' "$SIM/xcodebuild.log" | tail -40 || true
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild failed with exit $status; the tail of its log follows, the whole log is an artifact"
            tail -80 "$SIM/xcodebuild.log"
            exit "$status"
          fi
          app="$(ls -d "$SIM"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)"
          test -d "$app" || { echo "::error::xcodebuild produced no .app; see the xcodebuild log artifact"; tail -80 "$SIM/xcodebuild.log"; exit 1; }
          ls "$app/PlugIns" 2>/dev/null && echo "Widget extension present" || echo "::warning::no PlugIns folder: the widget extension did not embed"
          rm -rf "$APP_CACHE"/* && cp -R "$app" "$APP_CACHE/"
          cp -R "$app" "$APP_OUT/"
          echo "BUILD_KIND=cold (prebuild + xcodebuild)" >> "$GITHUB_ENV"
          echo "BUILD_SECONDS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Save the built app
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ${{ runner.temp }}/sim/cached
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # No native change: the cached binary, this commit's JS. repack-app re-exports the
      # bundle and writes it into a copy of the cached .app.
      - name: Repack this commit's JS (warm)
        if: steps.cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          t0=$(date +%s)
          src="$(ls -d "$APP_CACHE"/*.app | head -1)"
          out="$APP_OUT/$(basename "$src")"
          npx --yes @expo/repack-app@0.10.4 --platform ios --source-app "$src" --output "$out" --working-directory "$SIM/repack" --verbose .
          test -d "$out" || { echo "::error::repack produced no .app"; exit 1; }
          # The new bundle breaks the cached app's seal: re-sign it to run locally, keeping the
          # signature's own entitlements (the simulated ones live in the binary, untouched).
          codesign --force --sign - --preserve-metadata=identifier,entitlements,flags "$out"
          echo "BUILD_KIND=warm (cached binary + repacked JS)" >> "$GITHUB_ENV"
          echo "BUILD_SECONDS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      # Password AutoFill off before anything types a password (the row's first known trap):
      # its bar and its "Save password?" sheet steal the password field's taps. The setting
      # is the simulator's configuration profile, written while it is shut down and read on
      # the next boot. The files exist once the device has booted, which it did above.
      - name: Simulator settings (Password AutoFill off)
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl shutdown "$SIM_UDID"
          dir="$HOME/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data/Containers/Shared/SystemGroup/systemgroup.com.apple.configurationprofiles/Library/ConfigurationProfiles"
          mkdir -p "$dir/PublicInfo"
          for f in "$dir/UserSettings.plist" "$dir/EffectiveUserSettings.plist" "$dir/PublicInfo/PublicEffectiveUserSettings.plist"; do
            [ -f "$f" ] || plutil -create xml1 "$f"
            /usr/libexec/PlistBuddy -c 'Delete :restrictedBool:allowPasswordAutoFill' "$f" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c 'Add :restrictedBool dict' "$f" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c 'Add :restrictedBool:allowPasswordAutoFill dict' "$f"
            /usr/libexec/PlistBuddy -c 'Add :restrictedBool:allowPasswordAutoFill:value bool false' "$f"
            echo "$(basename "$f"): allowPasswordAutoFill=$(/usr/libexec/PlistBuddy -c 'Print :restrictedBool:allowPasswordAutoFill:value' "$f")"
          done
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b

      # Maestro drives the simulator through XCUITest and runs on the JVM the image carries.
      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          for v in 21 17; do
            for arch in arm64 X64; do
              var="JAVA_HOME_${v}_${arch}"
              if [ -n "${!var:-}" ]; then echo "JAVA_HOME=${!var}" >> "$GITHUB_ENV"; export JAVA_HOME="${!var}"; break 2; fi
            done
          done
          java -version
          zip="$RUNNER_TEMP/maestro.zip"
          curl -fsSL -o "$zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/maestro-dist"
          echo "$RUNNER_TEMP/maestro-dist/maestro/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maestro-dist/maestro/bin/maestro" --version

      - name: Install, launch, screenshot
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIM_UDID" -b
          app="$(ls -d "$APP_OUT"/*.app | head -1)"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun simctl install "$SIM_UDID" "$app"
          xcrun simctl launch "$SIM_UDID" "$bundle"
          # The landing screen: give the JS a moment past the splash.
          sleep 25
          xcrun simctl io "$SIM_UDID" screenshot "$SHOTS/launch.png"
          if ! pgrep -f "$exe.app/$exe" >/dev/null; then
            echo "::error::the app is not running 25s after launch: it crashed or exited (see the device log artifact)"
            exit 1
          fi
          echo "App $bundle is running"
          echo "APP_ID=$bundle" >> "$GITHUB_ENV"

      # The golden meal. Each attempt gets a fresh fixture host (the first attempt's pushed meal
      # would otherwise come back on the second's pull and fill Today before the log) and a
      # video of its own. One retry at most; FLOW_RESULT and FLOW_ATTEMPTS reach the summary.
      - name: Golden flow (sign in, log a meal, see it on Home)
        id: flow
        shell: bash
        run: |
          # Actions runs bash with -e; a failed attempt must reach the retry and the uploads.
          set +e -uo pipefail
          FIXTURE_EMAIL="$(node --experimental-strip-types -e 'import("./scripts/web-capture/fixtureRest.ts").then(m => process.stdout.write(m.FIXTURE_EMAIL))' 2>/dev/null)"
          FIXTURE_PASSWORD="$(node --experimental-strip-types -e 'import("./scripts/sim/fixtureServer.ts").then(m => process.stdout.write(m.FIXTURE_PASSWORD))' 2>/dev/null)"
          [ -n "$FIXTURE_EMAIL" ] && [ -n "$FIXTURE_PASSWORD" ] || { echo "::error::could not read the fixture credentials"; exit 1; }
          flow="$GITHUB_WORKSPACE/.maestro/golden-meal.yaml"
          result=failed
          for n in 1 2; do
            echo "::group::Attempt $n"
            node --experimental-strip-types scripts/sim/fixtureServer.ts "$FIXTURE_PORT" > "$SIM/fixture-$n.log" 2>&1 &
            fx=$!
            for _ in $(seq 1 40); do curl -fs "http://127.0.0.1:$FIXTURE_PORT/auth/v1/user" >/dev/null && break; sleep 0.5; done
            curl -fs "http://127.0.0.1:$FIXTURE_PORT/auth/v1/user" >/dev/null || { echo "::error::the fixture host did not start"; cat "$SIM/fixture-$n.log"; kill "$fx" 2>/dev/null; exit 1; }
            mkdir -p "$SHOTS/attempt-$n"
            xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force "$SHOTS/golden-meal-$n.mp4" > "$SIM/record-$n.log" 2>&1 &
            rec=$!
            sleep 2
            # Run from the attempt's folder: takeScreenshot writes relative to it.
            ( cd "$SHOTS/attempt-$n" && maestro test \
                --format junit --output "$SIM/maestro-$n.xml" \
                --test-output-dir "$SHOTS/attempt-$n" --debug-output "$SIM/maestro-debug-$n" \
                -e APP_ID="$APP_ID" -e FIXTURE_EMAIL="$FIXTURE_EMAIL" -e FIXTURE_PASSWORD="$FIXTURE_PASSWORD" \
                "$flow" )
            code=$?
            # The flow proves the local write and Home's render. The push is async, so whether
            # the meal reached the fixture host is read after, for up to 20s, and reported.
            if [ "$code" -eq 0 ]; then
              for _ in $(seq 1 40); do grep -q ' write meals ' "$SIM/fixture-$n.log" && break; sleep 0.5; done
              grep -q ' write meals ' "$SIM/fixture-$n.log" || echo "::warning::the meal showed on Home but never reached the fixture host: sync did not push it"
            fi
            sleep 1
            # SIGINT finalises the mp4. Bounded: a recorder that ignores it is killed after 20s
            # rather than holding the job to its timeout, and its file is called out as suspect.
            kill -INT "$rec" 2>/dev/null
            for _ in $(seq 1 40); do kill -0 "$rec" 2>/dev/null || break; sleep 0.5; done
            if kill -0 "$rec" 2>/dev/null; then
              kill -KILL "$rec" 2>/dev/null
              echo "::warning::the recorder ignored SIGINT on attempt $n: its video may be truncated"
            fi
            [ -s "$SHOTS/golden-meal-$n.mp4" ] || echo "::warning::attempt $n recorded no video"
            kill "$fx" 2>/dev/null; wait "$fx" 2>/dev/null
            echo "Fixture writes: $(grep -c ' write ' "$SIM/fixture-$n.log" || true) ($(grep -o 'write [a-z_]*' "$SIM/fixture-$n.log" | sort | uniq -c | tr '\n' ';'))"
            echo "::endgroup::"
            echo "FLOW_ATTEMPTS=$n" >> "$GITHUB_ENV"
            echo "VIDEO=$SHOTS/golden-meal-$n.mp4" >> "$GITHUB_ENV"
            echo "MEAL_WRITES=$(grep -c ' write meals ' "$SIM/fixture-$n.log" || true)" >> "$GITHUB_ENV"
            if [ "$code" -eq 0 ]; then result=passed; break; fi
            echo "::warning::attempt $n of the golden flow failed (exit $code)"
          done
          echo "FLOW_RESULT=$result" >> "$GITHUB_ENV"
          [ "$result" = passed ] || { echo "::error::the golden flow failed on both attempts: see the video and the Maestro debug output"; exit 1; }

      - name: Device log
        if: ${{ !cancelled() && env.SIM_UDID != '' }}
        shell: bash
        run: |
          xcrun simctl spawn "$SIM_UDID" log show --last 15m --style compact --info --debug \
            --predicate 'process CONTAINS "Culprit" OR eventMessage CONTAINS "com.projectnyx"' > "$SIM/device.log" 2>&1 || true
          # The app's own console (console.warn is below the default level, so --info above).
          grep 'react.log:javascript' "$SIM/device.log" > "$SIM/app-console.log" || true
          tail -60 "$SIM/app-console.log" || true
          tail -40 "$SIM/device.log" || true

      - name: Upload the screenshot
        id: shot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/sim/shots/launch.png
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      # The last attempt's video, unzipped so the summary's link plays it.
      - name: Upload the video
        id: video
        if: ${{ !cancelled() && env.VIDEO != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.VIDEO }}
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the flow's screenshots
        id: flowshots
        if: ${{ !cancelled() && env.FLOW_ATTEMPTS != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-smoke-flow-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sim/shots/attempt-*/**/*.png
            ${{ runner.temp }}/sim/shots/golden-meal-*.mp4
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the logs
        id: logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-smoke-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sim/xcodebuild.log
            ${{ runner.temp }}/sim/xcodebuild-scan-timeout.log
            ${{ runner.temp }}/sim/device.log
            ${{ runner.temp }}/sim/app-console.log
            ${{ runner.temp }}/sim/fixture-*.log
            ${{ runner.temp }}/sim/maestro-*.xml
            ${{ runner.temp }}/sim/maestro-debug-*/**
            ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          SHOT_URL: ${{ steps.shot.outputs.artifact-url }}
          LOGS_URL: ${{ steps.logs.outputs.artifact-url }}
          VIDEO_URL: ${{ steps.video.outputs.artifact-url }}
          FLOWSHOTS_URL: ${{ steps.flowshots.outputs.artifact-url }}
          RUNNER_LABEL: ${{ inputs.runner || 'xcode-27' }}
          FP: ${{ steps.fp.outputs.hash }}
        run: |
          total=$(( $(date +%s) - JOB_START ))
          {
            echo "## Simulator smoke"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`$RUNNER_LABEL\` ($(sw_vers -productVersion 2>/dev/null)) |"
            echo "| Xcode | ${XCODE_VERSION:-?} |"
            echo "| Simulator | ${SIM_NAME:-?} |"
            echo "| Build | ${BUILD_KIND:-did not finish} |"
            echo "| Build time | ${BUILD_SECONDS:-?}s |"
            if [ -n "${BUILD_NOTE:-}" ]; then echo "| Build note | $BUILD_NOTE |"; fi
            echo "| Job time | ${total}s |"
            echo "| Fingerprint | \`${FP:-?}\` |"
            echo "| Golden meal | ${FLOW_RESULT:-did not run}${FLOW_ATTEMPTS:+ (attempt $FLOW_ATTEMPTS of 2)} |"
            echo "| Meal rows pushed to the fixture | ${MEAL_WRITES:-?} |"
            echo
            if [ "${FLOW_ATTEMPTS:-1}" = 2 ]; then echo "> The first attempt failed and the retry ran: a flaky step is fixed, never quarantined (CUL-2875)."; echo; fi
            if [ -n "$VIDEO_URL" ]; then echo "- [Video of the golden meal]($VIDEO_URL)"; fi
            if [ -n "$FLOWSHOTS_URL" ]; then echo "- [The flow's screenshots and every attempt's video]($FLOWSHOTS_URL)"; fi
            if [ -n "$SHOT_URL" ]; then echo "- [Launch screenshot]($SHOT_URL)"; else echo "No screenshot was taken: see the failing step."; fi
            if [ -n "$LOGS_URL" ]; then echo "- [Build and device logs]($LOGS_URL)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
