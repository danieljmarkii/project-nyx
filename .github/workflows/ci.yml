# Culprit / Nyx — CI floor (B-390, audit §C1).
#
# Why this exists: until now the only gate on ~400 merges was the opt-in,
# locally-bypassable `.githooks/pre-push`. This is the server-side floor —
# the same two commands the hook runs, plus the Edge Function suites the hook
# never touches, enforced where they can't be skipped.
#
# Two jobs on purpose, run in parallel so each reports independently:
#   app            — the RN/Expo app: `tsc --noEmit` + jest (self-contained)
#   edge-functions — `deno test` over supabase/functions (needs network once)
# A network blip in one must not mask a real failure in the other.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A re-push supersedes its own in-flight run rather than queueing behind it —
# at the project's merge cadence the older run's verdict is already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here writes to the repo, posts a comment, or needs a token
# beyond checkout. Declared at the top level so no job can silently widen it.
permissions:
  contents: read

jobs:
  app:
    name: App (typecheck + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag is mutable, and
      # a CI job is the one place in this repo that runs third-party code with
      # the repo checked out. The trailing comment is the human-readable version
      # — bump both together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Major-pinned: Expo SDK 57 / RN 0.86 needs Node 20+, and 22 is what
          # the project develops against. Patch updates flow in automatically.
          node-version: '22'
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative and a
      # drifted package-lock.json fails here instead of resolving silently.
      # `.npmrc` supplies `legacy-peer-deps=true`, same as local installs.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # `--ci` makes an unmatched snapshot a failure instead of a silent write.
      - name: Jest
        run: npm test -- --ci

  edge-functions:
    name: Edge Functions (deno test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned to a known path so the cache step below can persist it. Without
      # this the graph is re-fetched from deno.land/esm.sh on every single run,
      # which makes every run depend on a third-party CDN being up — and on
      # 2026-07-25 esm.sh returned 522 for ~2.5 minutes and reddened this job.
      DENO_DIR: ${{ github.workspace }}/.deno-cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Yes, the Deno job needs the npm tree — this is not a copy-paste slip.
      # `deno test` type-checks, and typing `node:assert` pulls a
      # `@types/node` type-reference that Deno resolves out of `node_modules`
      # (because package.json is present, so Deno is in npm-workspace mode).
      # `@types/node` is only a TRANSITIVE dependency here — nothing declares it
      # — which is why this is invisible locally, where node_modules always
      # exists, and why the first CI run failed with
      # "Could not find a matching package for 'npm:@types/node'".
      # Same command and lockfile as the app job, deliberately.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Exact-pinned, unlike Node: `deno test` type-checks by default, so a
          # minor Deno bump can red this job on unchanged code. Bump deliberately
          # (run the suite locally first), not by drifting.
          deno-version: 2.9.4

      # The real mitigation for CDN flakiness: the module graph is pinned by
      # deno.lock, so it is byte-identical between runs and can simply be
      # restored. On a hit the `deno cache` step below is a no-op and this job
      # touches the network zero times — the outage window shrinks from "every
      # run" to "only runs that change deno.lock or bump Deno".
      - name: Restore the Deno module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-2.9.4-${{ hashFiles('deno.lock') }}
          # A partial hit still saves most of the fetch when deno.lock moves.
          restore-keys: |
            deno-${{ runner.os }}-2.9.4-

      # On a cache hit this is a no-op. On a miss it is the only step in the
      # workflow that touches the network, and it is retried, because a CDN
      # outage is an infra failure rather than a code failure — the assertion
      # step below then runs `--cached-only` and cannot fail on the network.
      #
      # `--lock=deno.lock` verifies every remote file against its committed
      # hash, so a URL whose content silently changed fails here. Deliberately
      # NOT `--frozen`: deno.lock's `workspace.dependencies` block still mirrors
      # the pre-SDK-57 package.json, so `--frozen` fails on a clean checkout and
      # would keep failing after every dependency bump until someone remembered
      # to regenerate the lockfile. Remote-hash integrity is the part that
      # matters and plain `--lock` gives it. (Lockfile drift → B-434.)
      - name: Warm the Deno module cache
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find supabase/functions -name '*.test.ts' | sort)
          # Guard against a green run that asserted nothing — if a rename or a
          # bad path ever empties this list, fail loudly instead of passing.
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::found no *.test.ts under supabase/functions"
            exit 1
          fi
          echo "Caching the module graph for ${#suites[@]} suites."
          # 4 attempts with 10/20/40s backoff. The observed esm.sh 522 outage
          # lasted ~2.5 min and the old 3×(5/10/15s) budget gave up ~30s in;
          # this rides out roughly that long. Only reached on a cache miss, so
          # being patient here costs nothing on the common path.
          # `timeout` guards the other failure mode: a stalled connection that
          # never returns would otherwise sit on one attempt until the job's
          # timeout-minutes, never reaching the retry. (Not what happened on
          # 2026-07-25 — those attempts each failed cleanly in ~39s — but a
          # retry loop that only handles clean failures is half a retry loop.)
          for attempt in 1 2 3 4; do
            # `|| status=$?`, not `if ...; then` — a compound `if` whose
            # condition fails and has no else branch itself returns 0, so `$?`
            # read after the `fi` is 0 and the real exit code is lost.
            status=0
            timeout 120 deno cache --lock=deno.lock "${suites[@]}" || status=$?
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            if [ "${status}" -eq 124 ]; then
              reason="timed out after 120s (stalled fetch)"
            else
              reason="failed with exit ${status}"
            fi
            if [ "${attempt}" -eq 4 ]; then
              echo "::error::deno cache ${reason} on the final attempt"
              break
            fi
            delay=$((10 * (2 ** (attempt - 1))))
            echo "::warning::deno cache attempt ${attempt} ${reason}; retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "::error::could not fetch the Edge Function module graph after 4 attempts — this is an upstream CDN failure (deno.land / esm.sh), not a code failure; re-run the job"
          exit 1

      # `--cached-only` forbids network here, so this step can only fail on the
      # code. Note this is also the ONLY type check covering supabase/functions —
      # tsconfig.json excludes that path, and `deno test` type-checks by default.
      - name: Deno test
        run: deno test --lock=deno.lock --cached-only supabase/functions/
